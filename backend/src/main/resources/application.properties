# Common Net — Spring Boot configuration
# Every value below is sourced from environment variables with the SAME
# names as the original Node .env file, so existing deployment secrets can
# be reused as-is: PORT, MONGO_URI, JWT_SECRET, JWT_EXPIRE, CLIENT_URL,
# SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM_NAME.

server.port=${PORT:5000}

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=commonnet

mailflow.jwt.secret=${JWT_SECRET}
# JWT_EXPIRE from the Node app was a string like "7d" for the `ms` package;
# here it's expressed directly in milliseconds. Default: 7 days.
mailflow.jwt.expire-ms=${JWT_EXPIRE_MS:604800000}

mailflow.cors.client-url=${CLIENT_URL:http://localhost:5500}

# ── SMTP (Gmail) — Spring Boot Mail auto-configures JavaMailSender from these ──
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
mailflow.smtp.from-name=${SMTP_FROM_NAME:Common Net}

# ── File uploads ────────────────────────────────────────────────────────────
mailflow.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ── Misc ─────────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.mailflow=INFO
