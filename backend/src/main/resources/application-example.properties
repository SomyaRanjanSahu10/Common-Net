# Copy this to a .env file (or export as real environment variables) before
# running the backend. Never commit real credentials.
#
# PORT=5000
# MONGO_URI=mongodb://localhost:27017/mailflow
# JWT_SECRET=replace-with-a-long-random-string-at-least-32-characters
# JWT_EXPIRE_MS=604800000
# CLIENT_URL=http://localhost:3000
#
# ── SMTP (Gmail) ─────────────────────────────────────────────────────────────
# 1. Enable 2-Step Verification at myaccount.google.com
# 2. Go to Security -> App passwords -> generate one for "Mail"
# 3. Paste the 16-character App Password as SMTP_PASS (no spaces)
#
# SMTP_HOST=smtp.gmail.com
# SMTP_PORT=587
# SMTP_USER=your-gmail-address@gmail.com
# SMTP_PASS=your-16-char-app-password
# SMTP_FROM_NAME=Common Net
