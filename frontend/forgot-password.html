<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Common Net</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="mf-auth-page">
    <div class="mf-auth-left">
      <div class="mf-auth-brand">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
          <path d="M8 10h8v8H8zM20 10h8v8h-8zM8 22h8v8H8zM20 22h8v8h-8z" fill="white"/>
        </svg>
        <h1>Common Net</h1>
      </div>
      <p class="mf-auth-tagline">We'll help you get back in.</p>
    </div>

    <div class="mf-auth-right">
      <div class="mf-auth-card">
        <h2 id="fp-icon-title">Forgot Password</h2>
        <p class="subtitle" id="fp-subtitle">Enter your email to receive a 6-digit OTP</p>

        <div id="fp-error" class="mf-auth-error" style="display:none;"></div>
        <div id="fp-msg" class="mf-auth-success" style="display:none;"></div>

        <form id="fp-step-email">
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input class="form-input" type="email" id="fp-email" placeholder="you@example.com" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;">Send OTP</button>
        </form>

        <form id="fp-step-otp" style="display:none;">
          <div class="form-group">
            <label class="form-label">6-digit OTP</label>
            <input class="form-input" type="text" id="fp-otp" maxlength="6" placeholder="000000" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;">Verify OTP</button>
        </form>

        <form id="fp-step-reset" style="display:none;">
          <div class="form-group">
            <label class="form-label">New password</label>
            <input class="form-input" type="password" id="fp-newpw" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm new password</label>
            <input class="form-input" type="password" id="fp-confirmpw" placeholder="Repeat password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;">Reset Password</button>
        </form>

        <div id="fp-step-done" style="display:none;text-align:center;">
          <p style="font-size:40px;margin-bottom:8px;">\uD83C\uDF89</p>
          <p style="margin-bottom:18px;">Your password has been reset successfully.</p>
          <a class="btn btn-primary" href="login.html" style="display:block;padding:11px;">Go to Sign in</a>
        </div>

        <div class="mf-auth-divider">Remembered your password? <a href="login.html">Sign in</a></div>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  let email = '';
  let resetToken = '';

  function showError(msg) {
    const el = document.getElementById('fp-error');
    el.textContent = '\u26A0 ' + msg; el.style.display = 'block';
    document.getElementById('fp-msg').style.display = 'none';
  }
  function showMsg(msg) {
    const el = document.getElementById('fp-msg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('fp-error').style.display = 'none';
  }
  function goToStep(step) {
    ['fp-step-email', 'fp-step-otp', 'fp-step-reset', 'fp-step-done'].forEach(id => {
      document.getElementById(id).style.display = id === step ? (step === 'fp-step-done' ? 'block' : 'block') : 'none';
    });
    const titles = {
      'fp-step-email': ['Forgot Password', 'Enter your email to receive a 6-digit OTP'],
      'fp-step-otp': ['Enter OTP', `Check your email (${email}) for the OTP`],
      'fp-step-reset': ['New Password', 'Create your new password'],
      'fp-step-done': ['Password Reset!', 'All set.'],
    };
    document.getElementById('fp-icon-title').textContent = titles[step][0];
    document.getElementById('fp-subtitle').textContent = titles[step][1];
  }

  document.getElementById('fp-step-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    email = document.getElementById('fp-email').value.trim();
    try {
      await api.post('/auth/forgot-password', { email });
      showMsg('OTP sent — check your inbox.');
      goToStep('fp-step-otp');
    } catch (err) { showError(err.message || 'Failed to send OTP.'); }
  });

  document.getElementById('fp-step-otp').addEventListener('submit', async (e) => {
    e.preventDefault();
    const otp = document.getElementById('fp-otp').value.trim();
    try {
      const data = await api.post('/auth/verify-otp', { email, otp });
      resetToken = data.resetToken;
      goToStep('fp-step-reset');
    } catch (err) { showError(err.message || 'Invalid or expired OTP.'); }
  });

  document.getElementById('fp-step-reset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('fp-newpw').value;
    const confirmPw = document.getElementById('fp-confirmpw').value;
    if (newPw !== confirmPw) return showError('Passwords do not match.');
    if (newPw.length < 6) return showError('Password must be at least 6 characters.');
    try {
      await api.post('/auth/reset-password', { resetToken, newPassword: newPw });
      goToStep('fp-step-done');
    } catch (err) { showError(err.message || 'Failed to reset password.'); }
  });
</script>
</body>
</html>
