<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Common Net</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="mf-auth-page">
    <div class="mf-auth-left">
      <div class="mf-auth-brand">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
          <path d="M8 10h8v8H8zM20 10h8v8h-8zM8 22h8v8H8zM20 22h8v8h-8z" fill="white"/>
        </svg>
        <h1>Common Net</h1>
      </div>
      <p class="mf-auth-tagline">Create your account and start emailing.</p>
    </div>

    <div class="mf-auth-right">
      <div class="mf-auth-card">
        <h2>Create account</h2>
        <p class="subtitle">Join Common Net today</p>

        <div id="reg-error" class="mf-auth-error" style="display:none;"></div>

        <form id="reg-form">
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input class="form-input" type="text" id="reg-name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="reg-password" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm password</label>
            <input class="form-input" type="password" id="reg-confirm" placeholder="Repeat your password" required>
          </div>
          <button type="submit" class="btn btn-primary" id="reg-submit" style="width:100%;padding:11px;">Create account</button>
        </form>

        <div class="mf-auth-divider">Already have an account? <a href="login.html">Sign in</a></div>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  document.getElementById('reg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('reg-error');
    const submitBtn = document.getElementById('reg-submit');
    errEl.style.display = 'none';

    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;

    if (password !== confirm) {
      errEl.textContent = '\u26A0 Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }
    if (password.length < 6) {
      errEl.textContent = '\u26A0 Password must be at least 6 characters.';
      errEl.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>';
    try {
      const data = await api.post('/auth/register', { name, email, password });
      Auth.setSession(data.token, data.user);
      location.href = 'inbox.html';
    } catch (err) {
      errEl.textContent = '\u26A0 ' + (err.message || 'Registration failed.');
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
