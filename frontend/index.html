<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Common Net</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
</head>
<body>
  <div class="empty-state" style="height:100vh;">
    <span class="spinner spinner-dark"></span>
  </div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // Entry point — mirrors the root "/" route in the original React Router
  // setup: authenticated users land in their inbox (or admin dashboard),
  // everyone else is sent to the login page.
  const user = Auth.getUser();
  if (Auth.isLoggedIn()) {
    location.href = (user && user.role === 'admin') ? 'admin.html' : 'inbox.html';
  } else {
    location.href = 'login.html';
  }
</script>
</body>
</html>
