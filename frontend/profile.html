<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Common Net</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/signature.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
  <div class="mf-app">
    <div id="sidebar-root"></div>
    <div class="mf-main">
      <div class="mf-toolbar">
        <button class="btn-icon mf-mobile-menu-btn" id="mf-mobile-menu-btn"></button>
        <span class="mf-toolbar-title">Profile</span>
      </div>
      <div style="overflow-y:auto;flex:1;">
        <div class="settings-page" style="display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;">
          <div class="settings-card" style="display:flex;flex-direction:column;align-items:center;gap:12px;">
            <div style="position:relative;width:100px;height:100px;">
              <div id="pf-avatar" class="avatar" style="width:100px;height:100px;font-size:28px;border:3px solid var(--ms-blue-light);"></div>
              <div id="pf-avatar-overlay" style="display:none;position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600;">Uploading&hellip;</div>
            </div>
            <button class="btn btn-secondary" id="pf-avatar-btn">Change Photo</button>
            <input type="file" id="pf-avatar-input" accept="image/*" style="display:none;">
            <div id="pf-name-display" style="font-weight:700;text-align:center;"></div>
            <div id="pf-email-display" style="font-size:12px;color:var(--ms-text-secondary);text-align:center;"></div>
          </div>

          <div class="settings-card">
            <h2>Personal Info</h2>
            <p class="subtitle">Update your profile details</p>
            <div id="pf-toast" style="display:none;" class="mf-auth-success"></div>
            <form id="pf-form">
              <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" id="pf-name" type="text">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Designation</label>
                  <input class="form-input" id="pf-designation" type="text">
                </div>
                <div class="form-group">
                  <label class="form-label">Department</label>
                  <input class="form-input" id="pf-department" type="text">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input class="form-input" id="pf-phone" type="text">
              </div>
              <div class="form-group">
                <label class="form-label">Bio</label>
                <textarea class="form-textarea" id="pf-bio" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="pf-save-btn">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/compose.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
